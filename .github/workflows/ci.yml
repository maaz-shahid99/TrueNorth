name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Engine — ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (editable, with dev deps)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check truenorth_engine tests
      - name: Test (pytest)
        # Live model tests self-skip unless TRUENORTH_LIVE_TESTS=1 + ANTHROPIC_API_KEY are set.
        run: pytest -q

  web:
    name: Web — typecheck + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (vitest)
        run: npm test

  e2e:
    name: Web — Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright, demo mode)
        run: npm run test:e2e
